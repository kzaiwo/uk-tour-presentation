const nav=document.getElementById('nav'),deck=document.getElementById('deck');let cur=0;
nav.innerHTML=slides.map((s,i)=>`<button onclick="go(${i})">${s.label}</button>`).join('')+`<span id="fx"><button onclick="fs(-.1)" title="Smaller text">A−</button><button onclick="fs(.1)" title="Larger text">A+</button> <small>1£ = S$<input type="number" step="0.01" value="1.72" oninput="RATE.SGD=+this.value||1;refreshAll()"> ₱<input type="number" step="0.5" value="76" oninput="RATE.PHP=+this.value||1;refreshAll()"></small></span>`;
function fs(d){const r=document.documentElement,v=Math.max(.7,Math.min(1.8,(parseFloat(r.style.getPropertyValue('--s'))||1)+d));r.style.setProperty('--s',v.toFixed(2))}
let HR={};try{HR=JSON.parse(localStorage.getItem('hr')||'{}')}catch(e){}
function setRating(n){const v=prompt('Google rating for '+n+' (for example 4.5). Leave empty to clear:',HR[n]||'');if(v===null)return;const x=parseFloat(v);if(isNaN(x))delete HR[n];else HR[n]=Math.min(5,Math.max(0,x)).toFixed(1);try{localStorage.setItem('hr',JSON.stringify(HR))}catch(e){}paintRatings()}
function paintRatings(){document.querySelectorAll('.hr').forEach(e=>{const n=e.dataset.h,r=HR[n],q=encodeURIComponent(n);e.innerHTML=(r?`<span class="rv" onclick="setRating(this.parentNode.dataset.h)" title="Click to edit">(${r}★)</span>`:(EX[n]?`<span class="rv">★ ${EX[n].rate}</span><small class="rs">Expedia · ${EX[n].rc} reviews</small>`:`<a class="gr" onclick="setRating(this.parentNode.dataset.h)">+ add rating</a>`))+`<a class="gr" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Google ↗</a>`})}
function rng(a,b){const g=n=>Math.round(n);return `£${g(a)}–${g(b)}<small class="cv">S$${g(a*RATE.SGD).toLocaleString()}–${g(b*RATE.SGD).toLocaleString()} · ₱${g(a*RATE.PHP).toLocaleString()}–${g(b*RATE.PHP).toLocaleString()}</small>`}
function rngH(a,b){const g=n=>Math.round(n).toLocaleString(),s='<span class="sp">|</span>';return `£${g(a)}–${g(b)}${s}S$${g(a*RATE.SGD)}–${g(b*RATE.SGD)}${s}₱${g(a*RATE.PHP)}–${g(b*RATE.PHP)}`}
function paintHotels(){document.querySelectorAll('.hp').forEach(e=>{const lo=+e.dataset.lo,hi=+e.dataset.hi;e.innerHTML=`<b>${rngH(lo,hi)}</b>`});paintRatings()}
function refreshAll(){paintHotels();DAYS.forEach((d,i)=>renderItems(i));renderCmp();renderSum()}
slides.forEach((s,i)=>{const e=document.createElement('section');e.className='slide'+(/^(Day|Overview|Title)/.test(s.label)?' fit':'');e.innerHTML=s.html;deck.appendChild(e)});
const inited=new Set();
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));document.querySelectorAll('.slide').forEach((e,i)=>e.classList.toggle('on',i===cur));
 nav.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===cur));
 document.getElementById('cnt').textContent=`${cur+1} / ${slides.length}`;document.getElementById('bar').style.width=(cur+1)/slides.length*100+'%';
 const s=slides[cur];loadPhotos(document.querySelectorAll('.slide')[cur]);if(s.init){if(!inited.has(cur)){inited.add(cur);setTimeout(s.init,50)}else if(cur>=slides.length-2)setTimeout(s.init,0)}
 setTimeout(()=>{const sl=document.querySelectorAll('.slide')[cur];Object.entries(maps).forEach(([id,m])=>{if(sl.contains(document.getElementById(id)))m.invalidateSize()})},260)}
document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type==='number')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
go(0);
paintHotels();
</script>
